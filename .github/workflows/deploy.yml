# Redespliega en Coolify cuando cambia la config del server en main.
# Opt-in: si no están los secrets configurados, el job se salta sin fallar.
#
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   COOLIFY_URL       ej. http://31.97.218.221:8000
#   COOLIFY_TOKEN     token de Coolify (usar uno dedicado, NO el de admin total)
#   COOLIFY_APP_UUID  uuid de la aplicación en Coolify
name: deploy

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "backup/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -uo pipefail
          if [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_APP_UUID:-}" ] || [ -z "${COOLIFY_URL:-}" ]; then
            echo "::notice::Secrets de Coolify no configurados. Deploy automático desactivado; desplegar desde la UI de Coolify."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
                   -H "Accept: application/json" \
                   "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}")
          echo "HTTP ${code}"
          cat /tmp/resp.json; echo
          case "$code" in
            200|201) echo "Deploy encolado en Coolify." ;;
            *) echo "::error::Coolify devolvió HTTP ${code}"; exit 1 ;;
          esac
