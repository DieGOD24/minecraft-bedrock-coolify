# Minecraft Bedrock Dedicated Server — versión FIJADA, no LATEST.
#
# El valor de VERSION abajo es la única fuente de verdad de qué versión corre
# el servidor. Se sube a mano (o mergeando el PR que abre la GitHub Action
# .github/workflows/check-bedrock-version.yml). Nunca poner LATEST aquí:
# Bedrock migra el formato del mundo al actualizar y no se puede volver atrás.

services:
  bedrock:
    image: itzg/minecraft-bedrock-server:2026.8.1
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      # Bedrock es UDP. Coolify respeta este mapeo y hace bypass de Traefik,
      # que no sabe enrutar UDP. Por eso la app NO lleva dominio.
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"

      # >>> EL PIN <<<  versión oficial de Mojang (serverBedrockLinux)
      VERSION: "1.26.44.3"

      SERVER_NAME: "Cerebria Bedrock"
      GAMEMODE: "survival"
      DIFFICULTY: "hard"
      LEVEL_NAME: "world"
      MAX_PLAYERS: "10"
      ALLOW_CHEATS: "true"      # habilita comandos/trucos en el mundo
      ONLINE_MODE: "true"
      SERVER_PORT: "19132"
      VIEW_DISTANCE: "16"
      TICK_DISTANCE: "4"
      # operator = todo el que entre puede usar comandos (/give, /gamemode, /kill...).
      # Combinado con ALLOW_LIST=false esto significa que CUALQUIER desconocido que
      # encuentre la IP entra con permisos de administrador. Decision consciente para
      # no depender de gamertags; si aparece griefing, el arreglo es llenar
      # ALLOW_LIST_USERS, o volver esto a "member" y usar OPS con gamertags.
      DEFAULT_PLAYER_PERMISSION_LEVEL: "operator"

      # Obliga a aceptar TODOS los resource packs del servidor (texturas, y los
      # de WAILA y Graves). El costo real: quien rechace la descarga, o a quien
      # le falle, NO PUEDE ENTRAR. Por eso los packs se eligen livianos: con
      # jugadores en datos moviles, un pack pesado deja gente afuera.
      TEXTUREPACK_REQUIRED: "true"

      # El VPS es dual-stack (tiene IPv6). Sin esto BDS puede quedarse
      # escuchando solo en IPv6 y los clientes IPv4 no lo encuentran.
      ENABLE_BDS_V6BIND_FIX: "true"

      # Consola remota por SSH en el 2222, NO publicada al host: solo alcanzable
      # desde dentro del stack. Es la unica via BIDIRECCIONAL a la consola. El
      # canal por /proc/<pid>/fd/0 que usa el sidecar escribe pero no lee, y la
      # API de Coolify solo devuelve los logs del contenedor mas nuevo (el
      # sidecar), nunca los de este. Con esto se corre `list`, `op`, gamerules,
      # etc. sin redesplegar y sin echar a los jugadores.
      ENABLE_SSH: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"

      # Avisa por chat antes de apagar, en vez de tirar a todos de golpe.
      STOP_SERVER_ANNOUNCE_DELAY: "30"
      STOP_SERVER_ANNOUNCE: "say El servidor se reinicia en %delay% segundos"

      # --- Control de acceso (hoy: servidor ABIERTO) ---
      #
      # OJO, esto NO es opcional ni redundante: BDS trae allow-list=true por
      # defecto en su propio server.properties. Si no se fuerza a "false" aqui,
      # el servidor arranca con la allowlist activa y vacia y rechaza a TODOS con
      # "no estas invitado a jugar en este servidor". Dejar ALLOW_LIST_USERS
      # comentado no alcanza: la imagen solo apaga la allowlist cuando esa
      # variable existe, asi que el default de BDS se impone.
      ALLOW_LIST: "false"
      #
      # Para CERRAR el servidor: poner gamertags aqui. Eso genera allowlist.json
      # y pone allow-list=true solo, ignorando el "false" de arriba.
      # ALLOW_LIST_USERS: "Gamertag1,Gamertag2"
      #
      # OPS quitado A PROPOSITO. La imagen resuelve los gamertags a XUID contra
      # mcprofile.io, que devuelve HTTP 523, y ante el fallo escribe el gamertag
      # CRUDO en el campo xuid sin avisar. Eso genero un permissions.json
      # invalido y dejo a todos sin comandos.
      # Los operadores se dan ahora con AUTO_OP_PLAYERS (ver servicio backup),
      # que usa `op` por consola y deja que BDS resuelva el XUID el mismo.
    volumes:
      - bedrock-data:/data
    # Mayor que STOP_SERVER_ANNOUNCE_DELAY: si no, el aviso se corta y el mundo
    # se guarda a medias.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
    # La imagen ya trae HEALTHCHECK propio (mc-monitor status-bedrock),
    # por eso Coolify muestra running:healthy sin config extra.

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    restart: unless-stopped
    depends_on:
      - bedrock
    # Comparte el PID namespace del server. Es lo que permite mandarle
    # "save hold" / "save resume" a la consola de BDS para sacar un snapshot
    # consistente, SIN montar /var/run/docker.sock (que daría control total
    # del host a un contenedor de un stack expuesto a internet).
    pid: "service:bedrock"
    cap_add:
      - SYS_PTRACE
    volumes:
      - bedrock-data:/data
    environment:
      MINIO_ENDPOINT: "${MINIO_ENDPOINT}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      MINIO_BUCKET: "${MINIO_BUCKET:-minecraft-backups}"
      RETENTION_DAYS: "${RETENTION_DAYS:-14}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_INITIAL_DELAY_SECONDS: "${BACKUP_INITIAL_DELAY_SECONDS:-300}"
      TZ: "America/Bogota"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      BEDROCK_SSH_HOST: "${BEDROCK_SSH_HOST:-bedrock}"
      # Debe coincidir con LEVEL_NAME de bedrock: install-addons.sh escribe
      # la activacion dentro de /data/worlds/<LEVEL_NAME>/.
      LEVEL_NAME: "world"
      # Entidades cuya existencia prueba que el addon cargo de verdad.
      ADDON_CHECK_ENTITIES: "hatchi:grave"
      # Jugadores a los que dar operador por consola apenas se los vea online.
      # BDS resuelve el XUID el mismo, sin depender de ninguna API externa.
      AUTO_OP_PLAYERS: "sebas GT1858,VeroB1297,WillowyWharf91"
      # Comandos que se mandan a la consola de BDS en cada arranque, uno por linea.
      # Es la unica via para fijar gamerules desde el repo: no son server.properties,
      # viven en level.dat y solo se cambian por consola. El sidecar puede hacerlo
      # porque comparte el PID namespace del server (ver `pid:` arriba).
      STARTUP_COMMANDS: |
        gamerule showcoordinates true
    # Sin esto el estado agregado de la app en Coolify queda en "unknown" y deja
    # de servir para monitoreo: un sidecar caído se vería igual que uno sano.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f /usr/local/bin/entrypoint.sh >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  bedrock-data:
